[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wlxq-bot"
version = "0.1.0"
description = "《永远的蔚蓝星球》微信小游戏本地自动化工具集"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "wlxq" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "mss>=9.0",
    "pillow>=10.0",
    "pywin32>=306",
    "pyautogui>=0.9.54",
    "rich>=13.7",
    "rapidocr-onnxruntime>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]
train = [
    "torch>=2.2",
    "torchvision>=0.17",
    "onnx>=1.16",
]

[project.scripts]
wlxq-bot = "wlxq_bot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wlxq_bot = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length 由 formatter 管
]

[tool.ruff.lint.isort]
known-first-party = ["wlxq_bot"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "smoke: 人工执行的端到端冒烟测试",
    "offline: 不依赖游戏窗口的离线测试",
]

[tool.coverage.run]
branch = true
source = ["src/wlxq_bot"]

[tool.coverage.report]
show_missing = true
skip_covered = false
