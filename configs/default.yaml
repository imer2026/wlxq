# 默认运行配置
# 通用运行默认值；任务坐标和 ROI 统一放在 configs/tasks.yaml

logging:
  # 文件日志（详见 docs/logging.md「文件日志」）：每次命令调用在 logs/ 下写一个
  # wlxq-bot_日期_时间.log，首行记录完整命令行；文件固定 file_level 级别
  # （默认 DEBUG，比控制台详细，与 --debug 无关），控制台行为不受影响；
  # 启动时按 retention_days 清理过期的 .log 文件（按修改时间）
  enabled: true
  dir: 'logs'
  file_level: 'DEBUG'
  retention_days: 7

screen:
  # 截图模式：fullscreen 全屏 / window 指定窗口客户区
  mode: window
  # 微信小游戏窗口标题（已实测确认）
  window_title: '永远的蔚蓝星球'
  # 窗口类名（用于多候选时缩小范围）
  window_class: 'Chrome_WidgetWin_0'
  screenshot_dir: 'screenshots/raw'
  # 支持的目标客户区尺寸，启动时按显示器可用空间选择
  target_sizes:
    - { width: 927, height: 1727 }
    - { width: 1920, height: 1080 }
    - { width: 2560, height: 1440 }
    - { width: 3000, height: 2000 }

vision:
  # 默认模板匹配置信度阈值
  default_threshold: 0.85
  debug: true
  debug_dir: 'screenshots/debug'
  # 退出帧缓冲：主循环保留最近 N 张截图（内存常驻约 N×4.8MB，927x1727 客户区，
  # 20 张约 96MB，只存引用不复制，无 CPU 开销），
  # 任务非正常退出（保守停止、失败/步数上限、异常崩溃）时批量落盘到
  # screenshots/debug/exit_<状态>_<时间戳>/；正常完成（COMPLETED）和
  # 用户主动停止（Esc、Ctrl+C）不保存；
  # 落盘路径以 WARNING 打进日志，便于事后排查「当时画面是什么」
  exit_frame_buffer_size: 20
  # 连续识别失败达到该阈值后暂停任务
  max_consecutive_failures: 5

input:
  click_duration: 0.08
  # 每次输入动作后的拟人随机间隔（秒）：导航类点击连续操作太快不像人
  # （2026-09-05 实机调定为 1.0~2.0，含返回/聊天/难度弹窗等导航点击）；
  # 抢合作/召唤有自己的节奏配置，不受影响
  min_delay: 1.0
  max_delay: 2.0
  # 拖动相关参数
  drag_duration: 0.5
  drag_pause: 0.2

safety:
  # 全局停止热键（当前监听器支持 Esc）
  stop_hotkey: 'esc'
  # 单任务最大连续失败次数
  max_failures: 5
  # 截图时效（毫秒），超过则丢弃动作并重新截图。
  # 2026-09-05 实机定案 15000：本机带标题/金币 OCR 的单帧识别约 4~10 秒，
  # 8000 会导致"识别成功但点击被丢弃"的循环；技能页为静态弹窗，稍旧的
  # 画面点击风险低，且有动作后验证兜底
  frame_ttl_ms: 15000
  # 慢机自适应上限（毫秒）：识别耗时持续超过 frame_ttl_ms 时生效时效翻倍
  # 放宽、封顶该值，机器恢复后自动回落；识别比该上限还慢才保守停止。
  # 2026-09-14 实机：机器高负载时领地入口单帧识别 19~61 秒，15 秒时效
  # 把全部决策拒之门外导致无进展停止——机器慢应慢跑而不是退出
  frame_ttl_max_ms: 90000
  # 无进展超时（秒），界面长时间不变化时暂停
  no_progress_timeout: 30

run:
  # 本次最多完成的合作局数
  max_rounds: 20
  # 单局调度循环的最终安全保险；完成一局后自动清零，不限制多局累计步数。
  # 正常停止主要依赖状态超时、失败上限和 max_rounds。
  max_steps_per_round: 5000
  # 开局强制召唤次数：逐次召唤满该次数（默认 7，填满开局 7 个开放格）后才做
  # 棋盘识别和技能选择；该阶段识别不阻断下一次点击。游戏门禁为累计召唤 5 次
  # 解锁局内选技能，7 次策略只是在其之上多召 2 个（2026-09-10 用户决策）
  minimum_summon_count_before_skills: 7
  # 合作开局开放 7 格
  initial_board_capacity: 7
  # 主 C 停止召唤和合成的最低星级
  target_star_level: 2
  # 每次召唤点击发送成功后，等待英雄落位再进行下一轮棋盘识别
  summon_recognition_delay_min: 1.0
  summon_recognition_delay_max: 2.0
  # 开局强制召唤的连点间隔（秒）：强制阶段和批次召唤共用；该阶段不做棋盘
  # 识别，点击发送即计数，快速连点；最后一次点完恢复正常稳定等待和识别
  forced_summon_interval_seconds: 0.5
  # 批次召唤（2026-09-10 用户策略）：培养阶段识别后棋盘有空位时按空格数
  # 规划一批召唤填满，每次点击前做金币门控（召唤费用红/白，毫秒级），
  # 金币不足原地等待；全部点完并稳定等待后重新识别棋盘
  batch_summon_enabled: true
  # 批次合成：棋盘识别一次，把互不相交的非主C 1/2星合法对一批拖完再统一
  # 识别；主C（强袭）对与3星对不进批次，仍走原单动作策略；拖动未生效的
  # 对在批末归因记入失败记忆，本局内跳过
  batch_merge_enabled: true
  # 通配合并英雄（赖子）：幻天使可与任意同星级英雄合并；同类项对优先、
  # 棋盘占满才使用（2026-09-13 定案，spec 2026-09-13-angel-phantom-split）
  wildcard_merge_heroes: [angel_phantom]
  # 召唤点击后棋盘始终未变化（多为金币不足）时的重试等待（秒）：等待后重新
  # 尝试召唤；回补阶段的召唤失败不等待，直接放弃回补回选技能
  summon_retry_delay_seconds: 15.0
  # 每次培养决策连续识别的棋盘帧数；DEBUG 日志会输出整批和单帧耗时
  board_recognition_frames: 10
  # 默认主 C：assault 强袭 / monkey 猴子
  default_main_c: assault
  # 组队对局模式：coop（合作模式）| pet（保卫宠物）；CLI --mode 覆盖本次运行
  mode: coop
  # 首次进入招募时需要勾选的合作难度（编号指彩虹难度）；按从小到大（如 1→10）依次点击
  coop_difficulties: '1-14'
  # 游戏本次会话已手动选过难度时置 true（或 run --skip-difficulty-selection）：
  # 首局招募只跳过「勾选难度等级」，难度弹窗仍打开并关闭一次以刷新最新合作邀请
  skip_difficulty_selection: false
  # run 启动时客户区与本机配置不一致则自动调整窗口尺寸（等价 adjust-window）；
  # 关闭后退回旧行为：报错停止并提示手动执行 adjust-window
  auto_adjust_window: true
  # 抢合作双线程：抢合作线程持续连点 join_coop，检查线程并行识别准备按钮，
  # 两者重叠，避免识别期间停止点击而错过新邀请。
  # 连点 join_coop 的拟人间隔（秒）
  find_coop_click_delay_min: 0.3
  find_coop_click_delay_max: 0.5
  # 检查线程识别准备按钮的间隔（秒）
  find_coop_check_interval_seconds: 1.0
  # 整段抢合作的最长时长（秒），超时未抢到则保守停止
  find_coop_max_duration_seconds: 3600
  # 抢合作弹窗关闭（2026-09-14 实机）：连点误点自己头像会弹出「个人信息」等
  # 全屏弹窗，检查线程识别右上角标准关闭按钮（×）后由抢线程点击关闭；
  # 重试上限复用 close_popup_max_retries。modal_edge_brightness 为全屏模态
  # 判定阈值（画面两侧边缘平均亮度低于此值视为有全屏面板；弹窗打开实测
  # 23~31，普通界面 ≥64）；grab_unknown_popup_confirmations 为「已越过招募
  # 阶段后边缘持续变暗且识别不到标准关闭按钮」的连续确认拍数，达到后保守
  # 停止并留证（招募页本身边缘也是暗的，未越过招募阶段不判未知弹窗）
  modal_edge_brightness: 45.0
  grab_unknown_popup_confirmations: 2
  # 单个目标难度识别不到时最多滚动重试次数（命中后重置；从没见过彩虹行的
  # 跳过不重置，后续目标直接级联跳过）；用尽则记录并跳过该目标，不影响
  # 后续抢合作。2026-08-19 起难度面板每次打开都定位在普通难度区（第1~12层），
  # 识别为空=尚未滚入彩虹区，会直接向更大难度滚动，预算需覆盖这段行程
  difficulty_max_scrolls: 15
  # 难度弹窗打开确认（2026-08-21 实机定案，2026-08-25 实机调 4→2）：点击打开
  # 按钮后短暂固定等待（等点击生效即可，打开慢由失败预算兜底），再按轮询间隔
  # 识别【合作模式】标题图；连续 N 次识别到才算打开（0.25×2 = 连续 0.5 秒可见）。
  # 连续 M 次识别不到（0.25×16 = 4 秒不出现）= 本次点击没生效 → 重点打开按钮
  # （最多重点 3 次），仍打不开则保守停止，绝不带着「没打开」的假设往下走
  difficulty_open_settle_seconds: 0.5
  difficulty_poll_interval_seconds: 0.25
  difficulty_open_confirm_hits: 2
  difficulty_open_fail_misses: 16
  difficulty_open_max_reclicks: 3
  # 难度弹窗关闭点击的最大次数；标题图可见=没关住就再点（实机确认：面板已
  # 收起时再点招募按钮无反应），达到上限仍可见则保守停止（弹窗挡住 join_coop
  # 抢合作无效）
  difficulty_close_max_attempts: 5
  # 确认弹窗关闭所需的连续标题图不可见次数（0.25×2 = 连续 0.5 秒不可见）；
  # 打开确认在前面把关，这里统一按连续不可见判定，无单帧捷径
  # （2026-08-25 实机调 4→2）
  difficulty_close_confirm_frames: 2
  # 难度列表单次拖拽耗时（秒）。过快会带惯性甩过头（如 16 直接滑到 3）；
  # 5 秒左右为无惯性慢拖，每次只推进一小段，便于逐级点击。
  difficulty_scroll_duration: 3.0
  # 点击准备后等待对局界面稳定
  ready_wait_seconds: 3.0
  # 技能识别多帧重试：主C技能图标在动，连续这么多帧没识别到才改「随便选一个」；
  # 每帧含截图识别约 0.6s + 等待 0.4s，5 帧约等待 5 秒后兜底
  skill_recognition_frames: 5
  # 确认开局技能选完所需的连续「页面已关闭」帧数；每次选完一张卡后页面会先关闭、
  # 下一组技能卡再弹出，间隙里召唤按钮会短暂露出，单帧不能判定选完（会漏选最后一组）
  opening_exit_confirm_frames: 3
  # 选技能/召唤的金币检查间隔（秒）：每 0.5 秒读一次金币，够就操作，不够就等
  # （2026-09-05 定案：节奏跟着金币走，取代旧的随机间隔；
  # 2026-09-09 实机调为 0.5 秒：选技能节奏和金币不足等待都明显加快）
  gold_check_interval_seconds: 0.5
  # 金币费用红色（游戏自身判买不起）时的等待时长（秒）：等待后重新识别再判，
  # 等击杀回金（2026-09-10 用户定案：红色等 1 秒再查）
  gold_red_wait_seconds: 1.0
  # 局内付费选技能流程（点【选技能】开页 / 按档位选卡 / 图标命中选卡 / 兜底
  # 选卡）点击后的固定间隔（秒）：替代全局 input.min/max_delay 的 1.0~2.0
  # 随机拟人间隔，加快「开页→OCR→选卡」循环（2026-09-13 实机：一轮 5 秒里
  # 1~2 秒是随机间隔）。间隔偏短时页面动画未播完只会多一次 0.2 秒的廉价
  # 验证重试，不会误点；开局技能页与 4 星赠送页不适用（其验证帧需完整
  # OCR 比对卡面）。0 = 退回全局随机拟人间隔
  skill_click_post_delay_seconds: 0.5
  # 其他队友英雄的技能卡图标（对应 hero_classifier.lineup_others 的三名英雄，
  # 实机采集 2026-08-15）：技能页已打开但未识别到主C图标时，识别到任一队友
  # 图标即确认页面已稳定、本组没有主C技能卡，立即随机选一张，
  # 不再等满 skill_recognition_frames 帧（每次省约 5 秒）
  teammate_skill_icon_templates:
    - skills/tian_shi.png
    - skills/xue_ji.png
    - skills/si_qi.png
  # 技能卡兜底点击前页面至少已出现的帧数：页面刚弹出时图标可能先于卡片
  # 渲染出来，首帧即点会点空（点空后验证失败重试一次要多花约 12 秒）
  skill_fallback_settle_frames: 1
  # 召唤、合成、准备和返回等严格动作最多观察多少帧确认结果
  action_verify_frames: 5
  # 关闭击杀奖励弹窗验证失败时的整动作重试上限（4 = 首次点击外再点 4 次）；
  # 连杀时关掉一个弹窗常立刻弹出下一个，模板再次命中，此时应重试而不是退出。
  # 重试耗尽仍失败才保守停止。
  close_popup_max_retries: 4
  # 领取结算宝箱后、点返回按钮前的稳定等待（秒）；实机确认宝箱动画未播完时点返回无响应
  reward_claim_return_delay: 4.0
  # 一局结束、点击返回前保存结算画面（合作/保卫宠物共用），按 模式/日期
  # 归档到 screenshots/settlement/<模式>/<日期>/roundNN_HHMMSS.png；
  # 保存失败只记日志，不影响任务
  settlement_screenshot: true
  # run 启动时清理超过该天数的按天截图目录（保留最近 N 天，含今天，
  # 目录名不是日期的不动）；仅 settlement_screenshot 开启时执行
  settlement_screenshot_retention_days: 7
  # 合成拖动验证失败时的重试上限；拖动可能落空（英雄仍在原位），重新决策后再拖；
  # 每次验证失败会输出棋盘诊断日志（起点英雄是否仍在、终点格星级）。
  # 重试耗尽仍失败才保守停止。
  merge_max_retries: 3
  # 合成拖动的时长（秒）。拖太快时游戏内英雄跟随不及，松开即被弹回原格；
  # 另外输入层会在终点停留约 0.15 秒再松开（InputController.release_dwell）
  merge_drag_duration: 1.0
  # 合成4星赠送技能页确认（2026-08-21 实机定案）：被迫合并 3 星对后，先固定
  # 等待页面渲染，再按轮询间隔识别【请选择1个额外技能】提示条；连续 N 次
  # 命中才选技能（半渲染/动画过渡帧不动作）；连续 M 次未命中视为拖动未生效
  # 或对局已结束（页面随结算消失），放弃等待恢复常规决策。等待期间击杀奖励
  # 弹窗仍优先关闭，返回按钮出现即正常转入结算。合成选择本身会尽量避开
  # 3+3（有空位召唤/合低星对，满盘才被迫合并），见 strategy.select_merge
  merge_gift_settle_seconds: 2.0
  merge_gift_poll_interval_seconds: 0.5
  merge_gift_confirm_hits: 2
  merge_gift_fail_misses: 12
  # 英雄变身（2026-09-13 用户策略，设计见 docs/superpowers/specs/2026-09-13-hero-transform-design.md）：
  # 3 星非主 C 且无达标主 C 时点击英雄 → 轮询头顶变身按钮 → 点击 → 验证
  # 类型必变星级不变；每局 transform_max_per_round 次、可对同一位置连用。
  # 按钮约 1 秒内弹出、无其他点击不消失、点按钮后先消失再变身（实机确认）。
  transform_enabled: true
  transform_max_per_round: 2
  transform_min_star_level: 3
  transform_button_poll_interval_seconds: 0.3
  transform_button_appear_timeout_seconds: 1.5
  transform_button_reclick_max: 2
  transform_settle_seconds: 4.0
  transform_verify_attempts: 2
  # 窗口非前台/最小化时的最长挂起等待（秒）：期间任务不发送任何输入（点击会落到
  # 当前前台窗口），对局自动进行，切回窗口后从当前进度继续；超过该时长才保守停止。
  # 想挂机离开更久（吃饭、回消息）可调大
  window_foreground_wait_seconds: 300.0
  # 挂起期间系统鼠标/键盘无输入超过该秒数（用户没用电脑）时，自动把游戏窗口
  # 切回前台继续任务；用户正在操作时不抢焦点，保持挂起等待。refocus_when_idle
  # 置 false 可整体关闭自动切回
  refocus_when_idle: true
  refocus_idle_seconds: 20.0
  # 识别出错自动重开：保守停止时（无可用动作/动作验证耗尽/截图时效连续超限）
  # 不退出任务，清空对局进度自动重新开始一局。连续重开 error_restart_max_consecutive
  # 次仍无任何进展（动作验证成功/完成一局会清零计数）才真正停止
  error_restart_enabled: true
  error_restart_max_consecutive: 3
  # 技能卡自动采集（统计阶段专用，平时保持 false）：技能页出现时顺手裁卡存档，
  # 供离线 `wlxq-bot build-skill-catalog` 建立技能清单（configs/skills.yaml）。
  # 运行时只做裁剪和哈希（毫秒级、节流），英雄归属与 OCR 全在离线建册时做；
  # 采集不参与任何决策、异常只记日志并自动熔断、写盘走后台线程，绝不阻塞对局。
  # 英雄技能固定，统计阶段采齐后即可关掉
  skill_collection:
    enabled: true
    # 输出目录（位于 gitignore 的 datasets/ 下，不提交仓库）
    output_dir: datasets/skill_cards
    # 采集器连续内部失败达该次数后自动停用（只记日志，不影响主流程）
    fuse_max_consecutive_failures: 5
    # 两次采集的最小间隔（秒）：技能页静态，采一次就够；节流保证采集开销
    # 不会侵蚀主循环的截图时效预算（safety.frame_ttl_ms）
    min_collect_interval_seconds: 30.0
    # 写盘队列容量；队列满时丢弃新采集并计数，绝不阻塞主循环
    queue_maxsize: 64
    # ---- 以下仅离线建册（build-skill-catalog）使用，运行时不读 ----
    # 英雄名 → 技能卡上的英雄图标模板（同一英雄所有技能卡共用一张图标）；
    # 不在名单内的卡按 unknown 归档，离线人工补标
    hero_icons:
      强袭: [skills/qiang_xi.png]
      天使: [skills/tian_shi.png]
      雪姬: [skills/xue_ji.png]
      死骑: [skills/si_qi.png]
    # 离线图标匹配置信度低于该值的卡归为 unknown
    min_icon_confidence: 0.70

main_c_profiles:
  assault:
    display_name: 强袭
    hero_template_dir: heroes/assault
    # 2026-09-18 游戏更新更换强袭立绘，v5 在新立绘上大量漏识别；v6 用
    # helper-newart 数据组重训（新立绘强袭 + 旧目录其他英雄），test 上强袭
    # star1~4 准确率 95.8%~99.0%
    hero_classifier_model: outputs/hero_classifier/assault-helper-v6/hero_classifier.onnx
    # 简化版技能识别：强袭技能卡上的英雄图标（同一英雄所有技能卡共用此图）
    skill_icon_templates:
      - skills/qiang_xi.png
    # 强袭策略（2026-08-16 实机规则）：合成尽量不用强袭——没有其他英雄可合成
    # 且棋盘有空位时召唤新英雄，不把两个强袭合成一个；棋盘占满时才合并强袭腾格子
    avoid_main_c_merge: true
    # 局内选满 4 次技能后回培养阶段检查一次强袭数量，补到 4 个以上后本局
    # 不再复查（2026-09-07 用户策略，一直选技能到对局结束）；回补时棋盘有
    # 空位只召唤不合成，占满才合成腾格子
    topup_after_skill_selections: 4
    topup_hero_count: 4
    # 局内技能选择总上限（不含开局赠送）：回补前 4 次 + 回补后 5 次 = 9 次，
    # 达到后不再花金币选技能，等对局结束进结算
    skill_selection_cap: 9
    # 技能选择优先级（标题 OCR 主路径）：档位号 → 技能名数组，数字越小越优先；
    # 同档多张随机点一张。第 8 档（强袭其他技能）与第 11 档（清单剩余技能）
    # 启动时自动计算；技能名需与 configs/skills.yaml 一致。删除本节即回退
    # 原有图标识别+随机选卡流程
    skill_priority:
      1: [天穹支援]
      2: [传导共振]
      3: [传导超载]
      4: [多束齐射]
      5: [神圣契约]
      6: [弱点锁定]
      7: [机体超频]
      9: [圣羽加持]
      10: [光矢协同]

  monkey:
    display_name: 猴子
    hero_template_dir: heroes/monkey
    # 种子模型（2026-09-23，两局 1611 张标注、十类全；正式模型待 9 局数据标注后重训）
    hero_classifier_model: outputs/hero_classifier/monkey-v3/hero_classifier.onnx
    skill_icon_templates: []
    # ---- 邀请者打法（spec 2026-09-21-initiator-monkey-design.md）----
    # 主C门禁 1 星即达标；开局召唤 5 个后点「准备完成」，对局内每批 3 个召唤凑阵容
    target_star_override: 1
    opening_summons: 5
    summon_batch_size: 3
    # 邀请者不合 3 星：产物星级 ≥3 的合并一律不做（棋盘占满也不做）
    forbid_star3_merge: true
    # 保留数：天使/雪姬/猴子至少 1 个在场才可合并消耗；死骑 0（可自由合）
    hero_keep_counts:
      angel: 1
      snow: 1
      death_knight: 0
    # 阵容门禁：天使 + 雪姬在场（猴子看星级门禁）才转纯选技能
    required_lineup_heroes: [angel, snow]
    # 幻天使是天使的形态（game-rules.md）：棋盘上有幻天使即算有天使
    lineup_variant_groups:
      angel: [angel_phantom]
    # 卡住时变身碰辅助：牺牲顺序死骑 → 雪姬（仅数量≥2 时）；天使/猴子永不在列
    transform_sacrifice_order: [death_knight, snow]
    # 技能优先级（2026-09-23 用户定案）：只锁两档——天使大、雪姬大；
    # 其他技能随便选：第 8 档（猴子其他技能）与第 11 档（清单剩余技能）
    # 启动时自动算到最低优先级，同档随机点一张
    # 三档模型（2026-09-25 定案）：天使大/雪姬大 + 其他（主C未列技能
    # 不优先，与其余技能同档随机）
    prefer_main_c_skills: false
    # 技能优先级（2026-09-25 用户定案）：1~7 档显式；未列出的技能全部
    # 落同一档随机（prefer_main_c_skills=false 使主C未列技能也并入）
    skill_priority:
      1: [神圣契约]
      2: [冰雪凤鸣]
      3: [圣羽加持]
      4: [江海翻, 天地倾]
      5: [称心如意]
      6: [大闹天宫]
      7: [乱点天宫, 战神化身]

  angel:
    display_name: 天使
    hero_template_dir: heroes/angel
    hero_classifier_model: outputs/hero_classifier/angel-helper/hero_classifier.onnx
    skill_icon_templates: []

  snow:
    display_name: 雪姬
    hero_template_dir: heroes/snow
    hero_classifier_model: outputs/hero_classifier/snow-helper/hero_classifier.onnx
    skill_icon_templates: []

  death_knight:
    display_name: 死骑
    hero_template_dir: heroes/death_knight
    hero_classifier_model: outputs/hero_classifier/death-knight-helper/hero_classifier.onnx
    skill_icon_templates: []

  fox:
    display_name: 狐狸
    hero_template_dir: heroes/fox
    hero_classifier_model: outputs/hero_classifier/fox-helper/hero_classifier.onnx
    skill_icon_templates: []

# 邀请者模式（run --invite）：组队等待/过滤/踢人循环参数
invite:
  # 帮助者关卡进度阈值：低于请离，不低于留下开局（2026-09-21 定 475，2026-09-25 调 375）
  min_stage_progress: 475
  # 请离后冷却秒数，之后重走邀请点击链
  kick_cooldown_seconds: 60
  # 等待无人进房的重发间隔：超时重走 5 步邀请点击链刷新邀请
  reinvite_after_seconds: 60
  # 连续空等重发轮数上限，超过保守停止
  max_empty_reinvites: 30
  # 连续请离帮助者上限，超过保守停止
  max_consecutive_kicks: 5
  # 等待帮助者进房总时长上限（秒）
  wait_timeout_seconds: 600
  # 合格帮助者进房后等待其点准备的超时秒数；0 = 一直等
  ready_timeout_seconds: 60

# 英雄格分类器数据制作配置
hero_classifier:
  # 主 C 之外、本局固定携带的队友英雄；crop 时据此与 main_c 一起预建
  # labeled/<英雄>/star1~star4 标注目录。切换 lineup 时改这里即可。
  # 必须是 main_c_profiles 中已定义的英雄标识。
  lineup_others: [angel, snow, death_knight]
  # 阵容英雄的棋盘形态变体：幻天使是天使的形态而非新英雄，不建 main_c_profiles
  # 档案、永不作为主 C；仅放行识别白名单（否则被拒为 hero_not_in_lineup → unknown）
  lineup_variants: [angel_phantom]

# 组队对局模式档案（方案 A）：存 configs/tasks.yaml 里的 hotspot/locator 名与
# 流程开关；素材本体在 tasks.yaml。详见 docs/superpowers/specs/2026-09-06-pet-defend-mode-design.md
mode_profiles:
  coop:
    display_name: 合作模式
    mode_chat_hotspot: coop_chat
    entry:
      mode_tab_hotspot: recruit_coop_tab
      # 页签 OCR 定位文字（识别区 tasks.yaml rois.mode_tab_row_area，三个页签
      # 共用）；删除本行回退为按 mode_tab_hotspot 固定坐标点击（旧行为）
      mode_tab_text: 合作模式
      # 领地入口（2026-09-09 新流程）：模式选择弹窗左卡「合作」+ 合作挑战页
      # 「开始挑战」；ROI 名见 tasks.yaml rois
      mode_card_roi: coop_mode_label_area
      mode_card_text: 合作
      challenge_roi: coop_challenge_start_area
      challenge_text: 开始挑战
      difficulty:
        kind: template
    match:
      ready_button: ready_button
      leave_team: coop_leave_team
    settlement:
      like_chest: true
      return_button: return_button
    main_c_overrides: {}
    strategy: default

  pet:
    display_name: 保卫宠物
    mode_chat_hotspot: pet_chat
    entry:
      mode_tab_hotspot: recruit_pet_tab
      mode_tab_text: 保卫宠物
      # 领地入口（2026-09-09 新流程）：模式选择弹窗右卡「保卫」+ 保卫宠物
      # 挑战页「挑战」；ROI 名见 tasks.yaml rois
      mode_card_roi: pet_mode_label_area
      mode_card_text: 保卫
      challenge_roi: pet_challenge_start_area
      challenge_text: 挑战
      # 每天首次进入保卫宠物挑战页弹出「本周Buff」弹窗：OCR 读【知道了】
      # 按钮文字并点文字框中心关闭（开环）。OCR 实测丢末字读成「知道」，
      # 匹配目标配两字（子串命中「知道」/「知道了」两种读法）；ROI 见
      # tasks.yaml rois.pet_weekly_buff_area（离线验证 2026-09-13）
      weekly_buff_roi: pet_weekly_buff_area
      weekly_buff_text: 知道
      difficulty:
        kind: ocr
        targets: [普通, 中等]
    match:
      ready_button: pet_ready_button
      leave_team: pet_leave_team
    settlement:
      like_chest: false
      return_button: pet_return_button
    main_c_overrides:
      assault:
        # 宠物模式强袭一直选技能到对局结束（2026-09-06 用户确认）
        skill_selection_cap: 0
    strategy: default
