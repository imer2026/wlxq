    # 占位路径（fox-helper 同款惯例）：洛姬只作为 lineup_others 成员出现，
    # 识别用主C档案的模型（monkey 档案 → monkey-v6，类别已含 loki/loki_phantom）；
    # 本字段仅在本档案作为主C启动时才会被加载，而那不该发生——模型文件
    # 不存在可让「模型覆盖守卫测试」按占位档案跳过
    hero_classifier_model: outputs/hero_classifier/loki-helper/hero_classifier.onnx
    skill_icon_templates: []

# 邀请者模式（run --invite）：组队等待/过滤/踢人循环参数
invite:
  # 帮助者关卡进度阈值：低于请离，不低于留下开局（2026-09-21 定 475，
  # 2026-09-25 调 375，2026-11-16 调 550）
  min_stage_progress: 550
  # 请离后等房间回空（邀请文字重现）的兜底秒数：回空立即回等待态继续检查
  # 进房 + 轻量邀请（60s 全量大轮回不因请离重置）；超时未回空才重走邀请链
  kick_cooldown_seconds: 60
  # 等待无人进房的全量重发间隔（秒）：重走完整邀请链（邀请→一键邀请→
  # 好友→公会招募→一键邀请→关弹窗）
  reinvite_after_seconds: 60
  # 轻量重邀间隔（秒，2026-09-26）：两次全量之间走 邀请→一键邀请（弹窗层）
  # →关弹窗 的短链刷新邀请曝光，不走好友页
  light_reinvite_interval_seconds: 15
  # 连续空等重发轮数上限，超过保守停止
  max_empty_reinvites: 30
  # 连续请离帮助者上限，超过保守停止
  max_consecutive_kicks: 5
  # 等待帮助者进房总时长上限（秒）
  wait_timeout_seconds: 600
  # 合格帮助者进房后等待其点准备的超时秒数；0 = 一直等
  ready_timeout_seconds: 60

# 英雄格分类器数据制作配置
hero_classifier:
  # 主 C 之外、本局固定携带的队友英雄的**全局默认**：主C档案未声明
  # lineup_others 时用于识别白名单/模型类别启动校验/技能档位过滤；crop
  # 数据制作也读这里。各账号游戏内阵容相互独立，阵容分叉的号在
  # main_c_profiles.<主C>.lineup_others 显式覆盖（如 monkey 9-28、
  # assault 10-01 换狐狸）。
  # 必须是 main_c_profiles 中已定义的英雄标识。
  lineup_others: [angel, snow, death_knight]
  # 阵容英雄的棋盘形态变体：幻天使是天使的形态而非新英雄，不建 main_c_profiles
  # 档案、永不作为主 C；仅放行识别白名单（否则被拒为 hero_not_in_lineup → unknown）
  lineup_variants: [angel_phantom]

# 组队对局模式档案（方案 A）：存 configs/tasks.yaml 里的 hotspot/locator 名与
# 流程开关；素材本体在 tasks.yaml。详见 docs/superpowers/specs/2026-09-06-pet-defend-mode-design.md
mode_profiles:
  coop:
    display_name: 合作模式
    mode_chat_hotspot: coop_chat
    entry:
      mode_tab_hotspot: recruit_coop_tab
      # 页签 OCR 定位文字（识别区 tasks.yaml rois.mode_tab_row_area，三个页签
      # 共用）；删除本行回退为按 mode_tab_hotspot 固定坐标点击（旧行为）
      mode_tab_text: 合作模式
      # 领地入口（2026-09-09 新流程）：模式选择弹窗左卡「合作」+ 合作挑战页
      # 「开始挑战」；ROI 名见 tasks.yaml rois
      mode_card_roi: coop_mode_label_area
      mode_card_text: 合作
      challenge_roi: coop_challenge_start_area
      challenge_text: 开始挑战
      difficulty:
        kind: template
    match:
      ready_button: ready_button
      leave_team: coop_leave_team
    settlement:
      like_chest: true
      return_button: return_button
    # 帮助者「准备完成」点击（2026-11-19 用户定案）：第一阶段培养凑出 2 星
    # 强袭时，画面无弹窗遮挡且识别到「准备完成」（locator zhun_bei_wan_cheng，
    # 坐骑消失锚点同源）就点匹配中心一下，随即回选技能；弹窗在场等关闭后的
    # 干净帧再查，一局只查一次，未命中不重试（游戏 ~90s 自动开始兜底）。
    # 点击后按钮消失同时让坐骑缺席计数开始锚定，坐骑释放随之提前。
    # pet 模式不配置本字段（默认 false），行为不变
    helper_ready_click: true
    main_c_overrides: {}
    strategy: default

  pet:
    display_name: 保卫宠物
    mode_chat_hotspot: pet_chat
    entry:
      mode_tab_hotspot: recruit_pet_tab
      mode_tab_text: 保卫宠物
      # 领地入口（2026-09-09 新流程）：模式选择弹窗右卡「保卫」+ 保卫宠物
      # 挑战页「挑战」；ROI 名见 tasks.yaml rois
      mode_card_roi: pet_mode_label_area
      mode_card_text: 保卫
      challenge_roi: pet_challenge_start_area
      challenge_text: 挑战
      # 每天首次进入保卫宠物挑战页弹出「本周Buff」弹窗：OCR 读【知道了】
      # 按钮文字并点文字框中心关闭（开环）。OCR 实测丢末字读成「知道」，
      # 匹配目标配两字（子串命中「知道」/「知道了」两种读法）；ROI 见
      # tasks.yaml rois.pet_weekly_buff_area（离线验证 2026-09-13）
      weekly_buff_roi: pet_weekly_buff_area
      weekly_buff_text: 知道
      difficulty:
        kind: ocr
        targets: [普通, 中等, 困难]
    match:
      ready_button: pet_ready_button
      leave_team: pet_leave_team
    settlement:
      like_chest: false
      return_button: pet_return_button
    main_c_overrides:
      assault:
        # 宠物模式强袭一直选技能到对局结束（2026-09-06 用户确认）
        skill_selection_cap: 0
    strategy: default
