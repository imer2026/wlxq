  home_page_mail_area:
    relative_to: client
    x_ratio: 0.8759
    y_ratio: 0.3521
    width_ratio: 0.1057
    height_ratio: 0.0533
  # 下列四个 ROI 尚待在有游戏的电脑上标定；0x0 会保守退化为全图识别。
  # 准备按钮 ROI，标定自 923×1723 客户区（wlxq-bot pick --rect）
  ready_button_area:
    relative_to: client
    x_ratio: 0.2340
    y_ratio: 0.7980
    width_ratio: 0.6295
    height_ratio: 0.1672
  # 返回按钮 ROI，2026-09-05 实机标定（对局结束结算页）
  return_button_area:
    relative_to: client
    x_ratio: 0.5027
    y_ratio: 0.8888
    width_ratio: 0.4056
    height_ratio: 0.0955
  # 双倍奖励弹窗标识 ROI，2026-09-05 实机标定
  double_reward_dialog_area:
    relative_to: client
    x_ratio: 0.0777
    y_ratio: 0.3596
    width_ratio: 0.8166
    height_ratio: 0.1372
  # 双倍奖励取消按钮 ROI，2026-09-05 实机标定
  double_reward_cancel_area:
    relative_to: client
    x_ratio: 0.0863
    y_ratio: 0.5211
    width_ratio: 0.3981
    height_ratio: 0.1048
  # 赠送技能卡片标识（卡片左上装饰），2026-09-05 实机标定
  zeng_song_area:
    relative_to: client
    x_ratio: 0.2611
    y_ratio: 0.2449
    width_ratio: 0.2352
    height_ratio: 0.0921
  # 退队按钮 ROI，2026-09-05 实机标定（组队大厅）
  leave_team_area:
    relative_to: client
    x_ratio: 0.5102
    y_ratio: 0.7012
    width_ratio: 0.3549
    height_ratio: 0.1146
  # 关闭弹窗按钮 ROI，2026-09-05 实机重新标定（击杀 Boss 奖励弹窗的提示条）
  tan_chuang_area:
    relative_to: client
    x_ratio: 0.3247
    y_ratio: 0.7887
    width_ratio: 0.3506
    height_ratio: 0.0625

  # 技能三候选区域，标定自 923×1723 客户区（wlxq-bot pick --rect）
  skill_candidates:
    relative_to: client
    x_ratio: 0.0152
    y_ratio: 0.2786
    width_ratio: 0.9621
    height_ratio: 0.3587
  # 合作难度弹窗的可滚动列表区域，标定自 923×1723 客户区（wlxq-bot pick --rect）
  coop_difficulty_list:
    relative_to: client
    x_ratio: 0.3218
    y_ratio: 0.5665
    width_ratio: 0.4930
    height_ratio: 0.2914

  # 金币感知三区域，标定自 927×1727 客户区（2026-09-05 实机截图）。
