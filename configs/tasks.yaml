    x_ratio: 0.0
    y_ratio: 0.0
    width_ratio: 0.0
    height_ratio: 0.0

# 保卫宠物难度弹窗 OCR 配置；min_confidence 是 OCR 文字置信度（离线验证
# 四行 0.76~0.85），语义与模板匹配置信度不同，不得混用
pet_difficulty_recognition:
  candidate_roi: pet_difficulty_list
  min_confidence: 0.5
  # 弹窗开关的关闭态锚点：OCR 读本区域文字，读到 bar_text=已收起（flag False），
  # 读不到=弹窗打开。弹窗关闭后邀请卡标题与难度行同区域，行存在性无法区分
  # 开关（2026-09-06 实机首跑踩中），故开关判定用收起栏文字而非难度行
  bar_roi: pet_difficulty_bar_area
  bar_text: 选择难度

# 招募页模式页签行 OCR 配置；三个页签共用一条识别区、一套识别逻辑，各模式
# 按 default.yaml mode_profiles 的 mode_tab_text 子串匹配。min_confidence 是
# OCR 文字置信度（离线验证三行 0.71~0.80），语义与模板匹配置信度不同，不得
# 混用；miss_limit 是连续识别不到页签文字的报错上限（帧数）
mode_tab_recognition:
  candidate_roi: mode_tab_row_area
  min_confidence: 0.5
  miss_limit: 8

# 「模式选择」弹窗 OCR 配置（领地页进入合作/保卫宠物的新入口）。标题区域
# 做弹窗开关锚点（读到 title_text=打开），两张模式卡整框四字卡名（合作模式/
# 保卫宠物，2026-09-13 重标——前两字小框切笔画致 1px 偏移即读空，见 rois
# 注释），按子串匹配并点击文字框中心（开环）。min_confidence 是 OCR 文字
# 置信度（离线验证 0.70~0.80，2026-09-13 ±3px 抖动复验），语义与
# 模板匹配置信度不同，不得混用；entry_wait_timeout_seconds 是入口链每个
# 等待步骤（领地变返回/弹窗出现/挑战页出现）的秒级上限；entry_max_reclicks
# 是「点击未生效」时的重点预算（领地未打开重点领地、弹窗仍开重点选卡），
# 每次重点重新起算等待上限，用尽仍不成功才保守停止；chat_open_max_reclicks
# 是聊天点击生效确认（挑战页锚点消失）的重点预算：点击被道具卡等弹窗
# 吃掉、页面未切换时重点聊天按钮（重点会顺带关掉挡路弹窗），整个确认
# 步骤共用一个 entry_wait_timeout_seconds 上限，用尽仍停留在挑战页才
# 保守停止（2026-09-16 实机：结算返回后金币说明卡盖住聊天按钮）
mode_select_recognition:
  title_roi: mode_select_title_area
  title_text: 模式选择
  coop_roi: coop_mode_label_area
  coop_text: 合作
  pet_roi: pet_mode_label_area
  pet_text: 保卫
  min_confidence: 0.5
  entry_wait_timeout_seconds: 60
  entry_max_reclicks: 3
  chat_open_max_reclicks: 10

# 棋盘格子坐标模型
# 由 wlxq-bot pick --rect 量测排1/排2 格子后计算得出（见 docs/game-rules.md）
# 知道这些参数即可推导全部 14 格中心坐标（models.BoardGridConfig.cell_center）
board:
  # helper 棋盘（右下己方）。2026-08-11 用 pick --rect 框选排2~排6 共 10 格，
  # 按中心线性拟合重算 anchor/步长（量测自 927×1727 客户区）；cell 尺寸沿用旧值
  # （框选尺寸噪声大，旧值略宽、相邻格仍保持正间距，做 ROI 更安全）。
  # 实帧(202608112148_frame000263)复核：整体上移 7px(5+2) 后底部对齐；再将 cell 高度
  # 向上扩 2px（cell_height_ratio +0.0012、anchor_y 同步 -0.0012，保持底部不变）。
  helper:
    anchor_x_ratio: 0.6215
    anchor_y_ratio: 0.5055
    col_step_ratio: 0.0801
    row_step_ratio: 0.0429
    cell_width_ratio: 0.0737
    cell_height_ratio: 0.0372
  # initiator 棋盘（左下），排6B量测反推锚点 + 复用 helper 步长/格宽高
  initiator:
    anchor_x_ratio: 0.1430
    anchor_y_ratio: 0.5141
    col_step_ratio: 0.0791
    row_step_ratio: 0.0432
    cell_width_ratio: 0.0737
    cell_height_ratio: 0.0360

# 技能识别配置（简化版：按主C英雄图标识别技能卡）
skills:
  # 技能三候选搜索 ROI（rois.skill_candidates）；兜底时横向三等分，
  # 取三列中心作为卡片点击点，无需额外标定兜底 hotspot。
  candidate_roi: skill_candidates
  threshold: 0.82
  # 主C技能卡图标模板在 default.yaml 的 main_c_profiles.<主C>.skill_icon_templates 配置；
  # 同一英雄所有技能卡共用一张图标，命中位置即主C技能卡，多个时随机点其一。

# 合作难度弹窗识别配置；文字模板为 cai_hong_1.png～cai_hong_18.png（19 待采集，
# 1~5/14~18 已按 2026-08-19 实机截图重新裁剪）。逐模板独立匹配，同一行多个
# 模板命中时保留置信度最高者；不识别勾选框状态（见 tasks/coop.py 开环注释）
difficulty_recognition:
  candidate_roi: coop_difficulty_list
  threshold: 0.78
  # 相似数字模板命中同一行时，按中心点距离合并并保留最高置信度
  merge_distance: 30

# 技能卡采集（统计阶段）几何参数；比例相对 rois.skill_candidates 裁剪结果。
# 只影响 datasets/ 下的离线采集存档，不影响任何业务决策
skill_collection:
  # 三等分切列后每列左右向内收的比例，避免带到相邻卡边缘
  column_inset_ratio: 0.04
  # 列裁剪顶部修剪比例：技能 ROI 顶端可能飘入战斗伤害数字，裁掉防误当技能名
  top_trim_ratio: 0.06

# 金币感知（回补召唤/付费选技能的金币门控）：读取 rois 的
# gold_current_area / skill_cost_area / summon_cost_area 三个数字区域。
# 三个 ROI 全部标定才会启用；读取结果存入 Observation.raw_data['gold']
gold_recognition:
  # 两次成功读取的最小间隔（秒）：也约束花钱事件触发的立即补读
  read_min_interval_seconds: 1.0
  # 数值门控（2026-09-26 替代只认色）：后台线程读 金币/费用 数字做数值
  # 比较，与颜色和皮肤无关——只认色在暗红棕城墙皮肤下恒判「买不起」
  # （2026-09-26 00:47 实机）。读数在后台线程完成，主循环零阻塞
  numeric_refresh_interval_seconds: 2.0
  # 快照年龄超过此值视同缺失 → 按「缺失不拦截」放行；只兜后台线程死亡
  numeric_stale_after_seconds: 30.0

