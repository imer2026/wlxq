  gold_current_area:
    relative_to: client
    x_ratio: 0.2891
    y_ratio: 0.8431
    width_ratio: 0.1036
    height_ratio: 0.0266
  # 选技能费用（左下按钮下方数字，如 100 / 1.8K；红色=买不起）
  skill_cost_area:
    relative_to: client
    x_ratio: 0.2621
    y_ratio: 0.9757
    width_ratio: 0.1381
    height_ratio: 0.0208
  # 召唤费用（右下按钮下方数字，如 80 / 515；红色=买不起）
  summon_cost_area:
    relative_to: client
    x_ratio: 0.5858
    y_ratio: 0.9757
    width_ratio: 0.1273
    height_ratio: 0.0208
  # 召唤按钮区域，2026-09-05 从实机截图离线标定（三局位置一致，命中 0.965+）
  summon_button_area:
    relative_to: client
    x_ratio: 0.5609
    y_ratio: 0.8859
    width_ratio: 0.1942
    height_ratio: 0.1100

  # 技能页三个页面标志的公共识别带（请选择 / 请选择1个额外技能 / 天使20级效果）
  # 2026-09-05 实机标定
  skill_page_markers_area:
    relative_to: client
    x_ratio: 0.0831
    y_ratio: 0.1471
    width_ratio: 0.8177
    height_ratio: 0.1297

  # 废弃字段：棋盘搜索范围现由格子模型（board.helper/initiator）的包围盒计算，
  # 不再使用 bottom_*_board。保留占位仅为兼容旧配置加载，标定与否都不影响识别。
  # initiator 视角左下方棋盘（本脚本常规流程为 helper，不标定）
  bottom_left_board:
    relative_to: client
    x_ratio: 0.0
    y_ratio: 0.0
    width_ratio: 0.0
    height_ratio: 0.0

  # helper 视角右下方棋盘（已废弃，识别 ROI 由 board.helper 包围盒确定）
  bottom_right_board:
    relative_to: client
    x_ratio: 0.0
    y_ratio: 0.0
    width_ratio: 0.0
    height_ratio: 0.0

# 棋盘格子坐标模型
# 由 wlxq-bot pick --rect 量测排1/排2 格子后计算得出（见 docs/game-rules.md）
# 知道这些参数即可推导全部 14 格中心坐标（models.BoardGridConfig.cell_center）
board:
  # helper 棋盘（右下己方）。2026-08-11 用 pick --rect 框选排2~排6 共 10 格，
  # 按中心线性拟合重算 anchor/步长（量测自 927×1727 客户区）；cell 尺寸沿用旧值
  # （框选尺寸噪声大，旧值略宽、相邻格仍保持正间距，做 ROI 更安全）。
  # 实帧(202608112148_frame000263)复核：整体上移 7px(5+2) 后底部对齐；再将 cell 高度
  # 向上扩 2px（cell_height_ratio +0.0012、anchor_y 同步 -0.0012，保持底部不变）。
  helper:
    anchor_x_ratio: 0.6215
    anchor_y_ratio: 0.5055
    col_step_ratio: 0.0801
    row_step_ratio: 0.0429
    cell_width_ratio: 0.0737
    cell_height_ratio: 0.0372
  # initiator 棋盘（左下），排6B量测反推锚点 + 复用 helper 步长/格宽高
  initiator:
    anchor_x_ratio: 0.1430
    anchor_y_ratio: 0.5141
    col_step_ratio: 0.0791
    row_step_ratio: 0.0432
    cell_width_ratio: 0.0737
    cell_height_ratio: 0.0360

# 技能识别配置（简化版：按主C英雄图标识别技能卡）
skills:
  # 技能三候选搜索 ROI（rois.skill_candidates）；兜底时横向三等分，
  # 取三列中心作为卡片点击点，无需额外标定兜底 hotspot。
  candidate_roi: skill_candidates
  threshold: 0.82
  # 主C技能卡图标模板在 default.yaml 的 main_c_profiles.<主C>.skill_icon_templates 配置；
  # 同一英雄所有技能卡共用一张图标，命中位置即主C技能卡，多个时随机点其一。

# 合作难度弹窗识别配置；文字模板为 cai_hong_1.png～cai_hong_18.png（19 待采集，
# 1~5/14~18 已按 2026-08-19 实机截图重新裁剪）。逐模板独立匹配，同一行多个
# 模板命中时保留置信度最高者；不识别勾选框状态（见 tasks/coop.py 开环注释）
difficulty_recognition:
  candidate_roi: coop_difficulty_list
  threshold: 0.78
  # 相似数字模板命中同一行时，按中心点距离合并并保留最高置信度
  merge_distance: 30

# 技能卡采集（统计阶段）几何参数；比例相对 rois.skill_candidates 裁剪结果。
# 只影响 datasets/ 下的离线采集存档，不影响任何业务决策
skill_collection:
  # 三等分切列后每列左右向内收的比例，避免带到相邻卡边缘
  column_inset_ratio: 0.04
  # 列裁剪顶部修剪比例：技能 ROI 顶端可能飘入战斗伤害数字，裁掉防误当技能名
  top_trim_ratio: 0.06

# 金币感知（回补召唤/付费选技能的金币门控）：读取 rois 的
# gold_current_area / skill_cost_area / summon_cost_area 三个数字区域。
# 三个 ROI 全部标定才会启用；读取结果存入 Observation.raw_data['gold']
gold_recognition:
  # 两次读取的最小间隔（秒）：金币变化缓慢，控制小 ROI OCR 的频率
  read_min_interval_seconds: 1.0

# 英雄模板配置
heroes:
  # 示例：强袭（占位，待采集模板）
  # assault:
