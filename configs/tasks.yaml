# 任务识别配置
# 业务状态机由任务代码实现；本文件保存识别定位器、ROI 和素材映射。

tasks:
  coop:
    # 合作任务：寻找合作 -> 进入游戏 -> 培养主C -> 结算
    description: "合作模式自动对局"
    main_c_required: true
    # 任务级超时（秒），0 表示不限制
    task_timeout: 0
    # 结算相关
    settle:
      reward_claim_timeout: 15

# 任务通用点击位置
# 游戏客户区固定为 9:16，统一使用相对客户区左上角的比例坐标并提交到仓库。
# 未实机确认的点保持缺失，任务会保守停止；用 `wlxq-bot pick` 量测后填写。
# hotspot 名字必须与 tasks/coop.py、orchestration/coop_grab.py 中引用保持一致。
hotspots:
  # ---- 邀请者模式（2026-09-21/22 实机标定，spec 2026-09-21-initiator-monkey-design.md）----
  # 组队大厅【邀请】按钮：点击弹邀请弹窗；等待期该位置「邀请」文字被遮 = 有人进房
  invite_button:
    x_ratio: 0.6904
    y_ratio: 0.6867
    description: 组队大厅【邀请】按钮（进房判定锚点）
  # 邀请弹窗【好友】页签
  invite_friend_tab:
    x_ratio: 0.8101
    y_ratio: 0.9450
    description: 邀请弹窗【好友】页签
  # 好友页【公会招募】入口
  invite_guild_recruit:
    x_ratio: 0.3107
    y_ratio: 0.8651
    description: 好友页【公会招募】入口
  # 【一键邀请】：弹窗层与好友页同坐标，5 步点击链中点两遍（2026-09-23 流程变更）
  invite_one_click:
    x_ratio: 0.6904
    y_ratio: 0.8610
    description: 【一键邀请】按钮（弹窗层/好友页共用坐标）
  # 邀请弹窗 × 关闭按钮（2026-09-24 实机标定，pixel (840, 248)）：邀请发出后
  # 弹窗仍开着、遮住合作页【邀请】文字，必须先关掉再开始进房判定
  invite_popup_close:
    x_ratio: 0.9061
    y_ratio: 0.1436
    description: 邀请弹窗 × 关闭按钮（邀请发出后关弹窗）
  # 组队大厅【请离】按钮（邀请者踢不合格帮助者；与帮助者退队同位不同文案）
  invite_kick:
    x_ratio: 0.6958
    y_ratio: 0.7788
    description: 组队大厅【请离】按钮
  # 帮助者信息层 × 关闭按钮兜底点击点（×模板识别不到时用；2026-09-22 实机
  # 截图个人信息弹层右上角 × 中心，pixel (843, 235)）
  invite_close_fallback:
    x_ratio: 0.9094
    y_ratio: 0.1361
    description: 帮助者信息层 × 兜底关闭点
  # 局内开局召唤完成后的「准备完成」（固定坐标点击，动作后验证）
  opening_ready_done:
    x_ratio: 0.6802
    y_ratio: 0.3017
    description: 局内「准备完成」按钮（OCR 定位 2026-09-22，像素 630/521）
  # 合作挑战页【开始挑战】按钮点击点（邀请者第 0 步：点它进邀请页面）。
  # 中心取自 coop_challenge_start_area 文字区（锚点+点击点二合一，同保卫
  # 宠物挑战按钮用法）
  invite_start_challenge:
    x_ratio: 0.5502
    y_ratio: 0.9540
    description: 合作挑战页【开始挑战】按钮（OCR 文字区中心）

  # 抢合作：最下面的「加入」按钮（coop_grab 连点此点抢合作）
  join_coop:
    x_ratio: 0.6084
    y_ratio: 0.7597
    description: 最下面的「加入」按钮

  # 增加英雄的按钮（底部操作栏）
  add_hero:
    x_ratio: 0.6966
    y_ratio: 0.9611
    description: 增加英雄的按钮

  # 选技能的按钮（底部操作栏）
  select_skill:
    x_ratio: 0.3294
    y_ratio: 0.9663
    description: 选技能的按钮

  # 鼠标停靠点：金币门控按钮（选技能/召唤）点击后把指针移到这里停靠。
  # 指针悬停在按钮上会触发游戏高亮效果，稀释下一帧费用区域红/白判定
  # （2026-09-10 实机：红色费用连续被误判为白色导致盲点）。选顶部波次
  # 横幅：无交互元素、不在任何识别 ROI 内
  mouse_park:
    x_ratio: 0.5
    y_ratio: 0.06
    description: 顶部波次横幅，鼠标停靠用

  # 游戏结束（结算）领取宝箱的按钮
  claim_chest:
    x_ratio: 0.2449
    y_ratio: 0.4927
    description: 游戏结束领取宝箱的按钮

  # 结算页点赞按钮
  like:
    x_ratio: 0.8862
    y_ratio: 0.4266
    description: 游戏结束点赞按钮

  # 合作页面聊天按钮（区别于首页聊天）
  coop_chat:
    x_ratio: 0.9274
    y_ratio: 0.4423
    description: 合作页面的聊天按钮

  # 宠物挑战页面聊天按钮（保卫宠物结算点返回后的落点页面，2026-09-06 实机
  # 标定，927×1727 客户区）。注意与 coop_chat（y=0.4423）不是同一位置，
  # 纵向差近 200px，不可互用。点击后进入招募流程（用户实测直接落到招募
  # 页面，仍按标准流程补点一次招募按钮，幂等）
  pet_chat:
    x_ratio: 0.9234
    y_ratio: 0.5541
    description: 宠物挑战页面的聊天按钮

  # 首页聊天按钮（2026-09-08 实机重新标定，927×1727 客户区，pixel (857, 949)）。
  # 2026-09-09 起招募入口改走领地入口，自动化流程不再点击本坐标，
  # 保留作 wlxq-bot click 手动点击与标定记录
  home_chat:
    x_ratio: 0.9245
    y_ratio: 0.5495
    description: 首页的聊天按钮（已退役，仅手动点击/标定用）

  # 聊天页面招募按钮。2026-09-09 起自动化流程不再点击本坐标（同 home_chat 退役）
  open_recruit:
    x_ratio: 0.0758
    y_ratio: 0.6413
    description: 聊天页面的招募按钮（已退役，仅手动点击/标定用）

  # 合作难度选择按钮，点击后弹出难度面板。面板列表分两区：普通难度
  # （合作模式-第1~12层）在前、彩虹难度（合作模式-彩虹1~19层）在后，
  # 每次打开都定位在普通区顶部；彩虹文字模板（cai_hong_1~16）见
  # buttons/coop_difficulty/
  open_difficulty_dialog:
    x_ratio: 0.5753
    y_ratio: 0.8299
    description: 选择合作的难度按钮

  # 难度选择面板的关闭点击点。2026-08-17 游戏更新后原「取消」按钮已不存在
  # （原坐标 0.2059/0.8276 落在难度行左侧空白，点击无效果）；面板打开时左侧
  # 栏「招募」按钮仍在原位（同 open_recruit 标定），点击它收起面板。
  close_difficulty_dialog:
    x_ratio: 0.0758
    y_ratio: 0.6413
    description: 点击左侧招募按钮收起难度选择面板

  # 难度列表滚动起点（列表偏上，列表竖直中线附近）
  difficulty_scroll_start:
    x_ratio: 0.5688
    y_ratio: 0.6204
    description: 难度列表滚动起点（列表偏上）

  # 难度列表滚动终点（列表偏下，与起点同列）。向更大难度滚动（滚入/深入
  # 彩虹区）从本点拖向起点（从下往上拉）；向较小难度滚动方向相反
  difficulty_scroll_end:
    x_ratio: 0.5970
    y_ratio: 0.7754
    description: 难度列表滚动终点（列表偏下）

  # 招募页模式页签（2026-09-08 实机标定，927×1727 客户区）：游戏新增第三个页签
  # 「共战灭尊」后，模式行从两页签变为三等分分段控件，整行内容左移。现布局为
  # 「合作模式 | 保卫宠物 | 共战灭尊」，容器 x 约 0.2255~0.9040（像素 209~838），
  # 中段选中态黄色胶囊（像素 423~624）中心即 recruit_pet_tab。
  # 自动流程已改用页签行 OCR 定位（rois.mode_tab_row_area + default.yaml
  # mode_tab_text），本组坐标保留作 wlxq-bot click 手动点击与标定记录。
  # 保卫宠物流程：点宠物页签 → 首次勾选保卫宠物-普通/中等 → 关闭难度弹窗 →
  # 连点 join_coop（坐标同抢合作）
  recruit_coop_tab:
    x_ratio: 0.3387
    y_ratio: 0.8859
    description: 招募页「合作模式」页签（默认选中）
  recruit_pet_tab:
    x_ratio: 0.5647
    y_ratio: 0.8859
    description: 招募页「保卫宠物」页签（新增共战灭尊后左移，2026-09-08 重标）
  # 「共战灭尊」页签文字中心约 (0.7913, 0.8859)，暂无自动化流程，仅留标定记录

  # 保卫宠物组队大厅【退队】按钮实测点击点（2026-09-05 实机，927×1727 客户区）。
  # 与合作的退队不同位：合作退队走模板匹配 coop_leave_team（识别区 leave_team_area，
  # 覆盖 y 0.701~0.816），本点 y=0.8616 在该识别区之外（偏下约 80px、偏右约 100px），
  # 直接复用必漏检。识别方案已定：专属模板 locator pet_leave_team（见 locators 同名项），
  # ROI 标定前全图识别起步
  pet_leave_team:
    x_ratio: 0.7994
    y_ratio: 0.8616
    description: 保卫宠物组队大厅【退队】按钮实测点（专属模板 locator，全图识别起步）

  # 底部导航「领地」按钮点击点（2026-09-09 实机标定，territory_nav_area 的
  # 几何中心，pixel (651, 1691)）。领地入口：读到「领地」才点（防误点
  # 「返回」退出领地页），点击后等 territory_nav_area 文字变「返回」
  territory_nav:
    x_ratio: 0.7023
    y_ratio: 0.9795
    description: 底部导航「领地」按钮（领地入口第一步）

  # 领地页进入「模式选择」弹窗的按钮（2026-09-09 实机标定，927×1727 客户区，
  # wlxq-bot pick，pixel (553, 514)）。计划流程：先点领地（rois.territory_nav_area
  # 读到「返回」=已在领地页），再点本按钮弹出模式选择弹窗（左合作模式、右
  # 保卫宠物）；点击后弹窗有延迟，用 rois.mode_select_title_area 的 OCR 轮询
  # 确认打开，不固定等待。弹窗内两张模式卡由 OCR 定位（rois.coop_mode_label_area /
  # rois.pet_mode_label_area），点击文字框中心，无需手动坐标
  open_mode_select:
    x_ratio: 0.5965
    y_ratio: 0.2976
    description: 领地页进入合作/保卫宠物模式选择弹窗的按钮

# 定位器配置
# 每个定位器声明策略、ROI 和动作点来源
# 坐标体系统一使用客户区比例（ratio），运行时按实际客户区尺寸换算为像素
locators:
  # ---- 邀请者模式 ----
  # 组队大厅【邀请】按钮图模板（2026-09-25 用户采集）：等待期模板匹配判
  # 「邀请」是否可见（可见=无人进房）——替代 OCR（等待帧 OCR 3s/帧导致
  # 帮助者进房后响应过慢）
  invite_button_label:
    strategy: template
    template: buttons/yao_qing.png
    threshold: 0.82
    roi: invite_text
  # 组队大厅【请离】按钮：邀请者请离不合格帮助者。与帮助者退队同区域不同文案，
  # 模板 qing_li.png（2026-09-22 采集），识别区复用退队按钮区 leave_team_area
  invite_kick_button:
    strategy: template
    template: buttons/qing_li.png
    threshold: 0.82
    roi: leave_team_area
    action_point:
      source: match_center
  # 组队大厅开局按钮「未准备」态：帮助者尚未点准备，继续等待
  invite_start_not_ready:
    strategy: template
    template: buttons/tiao_zhan_dui_you_wei_zhun_bei.png
    threshold: 0.82
    roi: invite_start_button_area
    action_point:
      source: none
  # 组队大厅开局按钮「已准备」态：帮助者已准备，点击该按钮开始对局
  invite_start_ready:
    strategy: template
    template: buttons/tiao_zhan_dui_you_zhun_bei.png
    threshold: 0.82
    roi: invite_start_button_area
    action_point:
      source: match_center
  # 合作任务启动页的正向识别标志。选取首页右侧信箱按钮（只在首页稳定出现）；
  # 模板已实机采集（home_page_mail.png），识别区域已标定。
  # 阈值 0.85：实机首页全图匹配置信度 1.000（2026-08-15，find 命令验证）；
  # 未逐页做非首页负样本验证，如出现误判再回调。
  home_page_marker:
    strategy: template
    template: buttons/home_page_mail.png
    roi: home_page_mail_area
    threshold: 0.85
    action_point:
      source: match_center
  # 抢合作成功后出现的准备按钮；点击匹配中心。
  ready_button:
    strategy: template
    template: buttons/zhun_bei.png
    threshold: 0.82
    roi: ready_button_area
    action_point:
      source: match_center
  # 胜负结算都会出现同一个返回按钮；出现即表示本局结束。
  return_button:
    strategy: template
    template: buttons/fan_hui.png
    threshold: 0.82
    roi: return_button_area
    action_point:
      source: match_center
  # 击杀精英/Boss 后弹出的奖励弹窗关闭按钮；游戏内出现即点击关闭，时机不定。
  tan_chuang:
    strategy: template
    template: buttons/tan_chuang.png
    threshold: 0.82
    roi: tan_chuang_area
    action_point:
      source: match_center
  # 全屏弹窗右上角标准关闭按钮（×）：抢合作连点误点自己头像弹出「个人信息」
  # 等全屏弹窗时挡住准备按钮，识别到即点击关闭。皮肤随玩家装扮变化，但 ×
  # 按钮为游戏标准控件跨皮肤一致（2026-09-14 实机三主题 0.99+，普通界面
  # 负例 ≤0.67）。ROI 限右上角：全图搜索会在画面中部误中相似图案。
  close_button:
    strategy: template
    template: buttons/x.png
    threshold: 0.85
    roi: close_button_area
    action_point:
      source: match_center
  # 【选技能】图：技能选择页面（3 张技能卡）的标识。开局免费自动弹出或局内点「选择技能」
  # 按钮（花金币）后都会出现该页面。开局时它遮住召唤按钮，必须选完消失后才能召唤。
  # 只用于识别页面状态（开局流程不点击它），与 summon_button 按「先选技能、再召唤」识别开局类型。
  # ROI 待在有游戏的电脑上标定；标定前 _resolve_named_roi 缺省走全图识别。
  select_skill_button:
    strategy: template
    template: buttons/xuan_ze_ji_neng.png
    threshold: 0.82
    roi: skill_page_markers_area
    action_point:
      source: match_center
  # 【请选择1个额外技能】提示条：两个3星合成4星后弹出的赠送技能页（3选1）标识。
  # 实机确认 2026-08-21：该文案只在赠送页出现，不选技能页面就常驻；【选技能】图
  # 在该页上不稳定（实机出现过整页在等选择却始终未命中的情况），以此模板为页面主标识。
  # 页面可能被Boss奖励弹窗遮挡：任务层先关弹窗再识别本图。ROI 待标定，标定前走全图识别。
  merge_gift_skill_title:
    strategy: template
    template: skills/4_xing_e_wai_ji_neng.png
    threshold: 0.82
    roi: skill_page_markers_area
    action_point:
      source: match_center
  # 【召唤】按钮：棋盘上召唤英雄的按钮。进入游戏后若无开局技能、或开局技能已选完
  # （【选技能】页面消失）则可见，标识已进入/可进入召唤阶段。ROI 已从实机截图
  # 离线标定（2026-09-05，三局位置一致）。
  summon_button:
    strategy: template
    template: buttons/zhao_huan.png
    threshold: 0.82
    roi: summon_button_area
    action_point:
      source: match_center
  # 【天使开局技能】页标识：天使英雄的开局技能页不出现【选技能】图，也没有主C技能图标，
  # 只出现该图（实机采集 2026-08-15）。开局阶段命中即在该页随机选一张技能卡。
  # 仅在开局技能阶段识别；ROI 待标定，标定前走全图识别。
  tian_shi_kai_ju:
    strategy: template
    template: buttons/tian_shi_kai_ju.png
    threshold: 0.82
    roi: skill_page_markers_area
    action_point:
      source: match_center
  # 【赠送技能】卡片：同一系列技能选满 3 个后赠送的技能展示卡（如穿星折射），
  # 点击任意位置关闭，处理方式同 Boss 奖励弹窗。仅在选技能阶段识别。
  zeng_song_ji_neng:
    strategy: template
    template: skills/zeng_song_ji_neng.png
    threshold: 0.82
    roi: zeng_song_area
    action_point:
      source: match_center
  # 局内技能页「刷新」按钮：三张卡均无主C系技能（优先级档位全部 ≥9）时点一次
  # 换卡（每局最多 RunConfig.skill_refresh_max_per_round 次）。仅
  # SELECT_MAIN_C_SKILLS 状态识别；开局技能页/天使页/4星赠送页不识别、不刷新
  # （2026-09-12 用户确认：刷新只在局内「请选择」页，一局一次，点击直接生效无弹窗）
  skill_refresh_button:
    strategy: template
    template: buttons/shua_xin.png
    threshold: 0.82
    roi: skill_refresh_button_area
    action_point:
      source: match_center
  # 【合作模式】标题图：难度弹窗打开时的稳定标识。2026-08-21 更换为重新采集的
  # 标题图（buttons/coop_difficulty/）；旧图（2026-08-15）实为列表行内
